[project]
name = "earnings-watch"
version = "0.1.0"
description = "Flags public companies whose reported earnings outrun their cash, from SEC EDGAR filings."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff==0.17.1",
    "pre-commit>=4.7,<5",
    "sqlfluff==4.4.0",
    # Same versions as the Airflow 3.3.1 constraints, so tests behave like the containers.
    "requests==2.34.2",
    "urllib3==2.7.0",
    "responses==0.26.3",
    "boto3==1.43.56",
    "botocore[crt]==1.43.56",  # [crt] adds awscrt, which `aws login` credentials need
    "moto[s3]==5.2.4",
    # The thin slice: local analytics and the single-node baseline Spark is benchmarked against.
    "duckdb==1.5.6",
]

[tool.uv]
package = false  # a monorepo of runtimes, not an installable package

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "airflow/dags", "slice"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

[tool.ruff.lint.isort]
known-third-party = ["airflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["airflow/dags", "slice"]
addopts = "-ra"
