# The public site: built from the pipeline's latest export, deployed to GitHub Pages (ADR 17, 19).
# A repository has one Pages site, so this is the only workflow that deploys it.
#
# Three jobs, so the app's build tools never run where there are credentials: `export` (AWS)
# downloads and checks the export; `app` (no credentials) builds the app from it with npm and
# puts the app beside the export's files; `deploy` (Pages) publishes what `app` assembled.
name: Site

on:
  # The publish_site DAG starts this after every good dbt build, naming its export.
  workflow_dispatch:
    inputs:
      export:
        description: >-
          The export to deploy (exports/site/runs/<run>). Empty: the latest one. Name an older
          run to roll the site back.
        type: string
        required: false
        default: ""
  # The fallback, after the host's morning window: deploys the latest export even if the DAG
  # could not start this workflow (an expired token, say; the DAG alerts on that too).
  schedule:
    - cron: "30 10 * * *"
  # A change to how the site is built takes effect without waiting for the pipeline.
  push:
    branches: [main]
    paths:
      - .github/workflows/site.yml
      - scripts/build_site.py
      - site/**

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false  # never stop a deployment halfway; the next one waits its turn

jobs:
  export:
    name: Download and check the export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only main may use this environment, and only jobs in it can assume gha-site.
    environment: github-pages
    permissions:
      contents: read  # check out scripts/build_site.py
      id-token: write  # AWS verifies this job with OIDC (gha-site)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_SITE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Download the export and check it against its manifest
        env:
          LAKE_BUCKET: ${{ vars.LAKE_BUCKET }}
          EXPORT: ${{ inputs.export }}
        run: python3 scripts/build_site.py --bucket "$LAKE_BUCKET" --export "$EXPORT" --out _site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: export
          path: _site
          if-no-files-found: error
          retention-days: 1

  app:
    name: Build the app from the export (no credentials)
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # check out site/ and scripts/build_site.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: site/.nvmrc
          package-manager-cache: false  # a deployment builds from the lockfile, never a cache

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: export
          path: _site

      - name: Install exactly the lockfile (no install scripts run; site/.npmrc)
        working-directory: site
        run: npm ci

      - name: Build the app, its first numbers read from the export into the pages
        working-directory: site
        env:
          EW_DATA_DIR: ../_site
        run: npm run build

      - name: Put the app beside the export's files
        run: python3 scripts/build_site.py --add-app site/build --out _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write  # Pages verifies this job with OIDC
      pages: write  # deploy the site
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
