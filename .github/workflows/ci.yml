name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow reads the code; only the release job asks for more.
permissions:
  contents: read

# Every step runs in bash with -e and -o pipefail. Without an explicit shell, GitHub uses bash -e
# alone, and a failure before a pipe (deploy | tee) would pass silently.
defaults:
  run:
    shell: bash

# A newer push cancels a still-running check of an older pull request. Runs on main are never
# cancelled: a release stopped halfway would leave published artifacts without a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to exact commits, not movable version tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"  # the same Java as EMR's emr-spark-8.0.0 runtime

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        env:
          REQUIRE_SPARK_TESTS: "1"  # fail, never skip, if Java is missing
        run: uv run pytest -v

  image-tests:
    # Both images, tested as they will run, on every push and pull request: the DAG integrity tests
    # in the base image, then the production image's smoke test (every service healthy, every DAG
    # imported, every module the DAG code can import present). Built on arm64, the host's
    # architecture. Nothing is pushed: the release job builds and pushes on main.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Build the base and production images
        run: |
          docker build -t earnings-watch-airflow:ci airflow
          docker build -f airflow/Dockerfile.prod --build-arg BASE_IMAGE=earnings-watch-airflow:ci \
            -t earnings-watch-airflow:ci-prod .

      - name: DAG integrity tests, inside the base image
        run: scripts/test_dags.sh earnings-watch-airflow:ci

      - name: Smoke test the production image
        env:
          SMOKE_TEST_THROWAWAY: "1"  # generated keys and secrets: CI never holds a real one
        run: scripts/smoke_test_prod_stack.sh earnings-watch-airflow:ci-prod

      - name: Known vulnerabilities in the image's Python environments (pip-audit)
        run: |
          docker run --rm --entrypoint python earnings-watch-airflow:ci-prod -m pip freeze --all \
            | grep -v '^-e ' > /tmp/airflow-env.txt
          docker run --rm --entrypoint /opt/dbt_venv/bin/python earnings-watch-airflow:ci-prod \
            -m pip freeze --all | grep -v '^-e ' > /tmp/dbt-env.txt
          scripts/audit_python.sh /tmp/airflow-env.txt "the image's Airflow environment"
          scripts/audit_python.sh /tmp/dbt-env.txt "the image's dbt environment"

      - name: Operating-system vulnerabilities in the image (Trivy 0.76.1, checksum verified; report only)
        run: |
          curl -fsSL -o /tmp/trivy.tgz \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-ARM64.tar.gz
          echo "e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          /tmp/trivy image --quiet --scanners vuln --pkg-types os --format json --output /tmp/trivy.json \
            earnings-watch-airflow:ci-prod
          python3 scripts/summarize_trivy.py /tmp/trivy.json | tee -a "$GITHUB_STEP_SUMMARY"

  security:
    # Secrets anywhere in the history (gitleaks), and known vulnerabilities in the project's
    # lockfile (pip-audit). Both block, except vulnerabilities accepted, by ID and with a reason,
    # in security/accepted-vulnerabilities.txt. The image's environments are audited in image-tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # every commit: a secret that was deleted is still in the history
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Secrets in the whole history (gitleaks 8.30.1, checksum verified)
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-level warn --verbose .

      - name: Known vulnerabilities in the project's lockfile (pip-audit)
        run: |
          uv export --frozen --format requirements-txt --no-hashes --all-groups --no-emit-project \
            > /tmp/project.txt
          scripts/audit_python.sh /tmp/project.txt "the project's lockfile"

  dbt-slim-ci:
    # Pull requests: build the dbt models the pull request changed, and everything downstream, in
    # schemas of its own (PR_<number>_*) in EARNINGSWATCH_CI, reading everything unchanged from
    # production (--defer). Compared with the dbt manifest of the release production runs.
    # Pull requests from forks are skipped: a stranger's code never runs with SVC_CI's key.
    # Dependabot's pull requests get no secrets or OIDC token, and never change dbt.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # gha-plan (read-only) fetches the production manifest
    env:
      LAKE_BUCKET: ${{ vars.LAKE_BUCKET }}
      DBT_CI_SCHEMA: PR_${{ github.event.pull_request.number }}
      DBT_SOURCE_DATABASE: EARNINGSWATCH_DEV
      DBT_SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/svc_ci_rsa_key.p8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: The production manifest (the current release's)
        run: |
          release="$(aws s3 cp --only-show-errors "s3://$LAKE_BUCKET/artifacts/releases/current.env" - \
            | sed -n 's/^AIRFLOW_IMAGE=.*://p')"
          [[ "$release" =~ ^[0-9a-f]{12}$ ]] || { echo "no current release to compare with" >&2; exit 1; }
          mkdir -p prod-state
          aws s3 cp --only-show-errors "s3://$LAKE_BUCKET/artifacts/dbt/$release/manifest.json" \
            prod-state/manifest.json
          echo "comparing with release $release"

      - name: Install dependencies
        run: uv sync --locked

      - name: What this pull request changes
        id: changes
        working-directory: dbt
        run: |
          if [ -f packages.yml ]; then uv run dbt deps --quiet; fi
          uv run dbt ls --target ci --select "state:modified+" --state ../prod-state --quiet \
            > ../changed.txt
          echo "count=$(wc -l < ../changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < ../changed.txt | tr -d ' ') dbt node(s) to build and test:"
          cat ../changed.txt

      - name: SVC_CI's key
        if: steps.changes.outputs.count != '0'
        env:
          KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "the SNOWFLAKE_CI_PRIVATE_KEY secret is not set" >&2; exit 1; }
          (umask 077; printf '%s\n' "$KEY" > "$DBT_SNOWFLAKE_PRIVATE_KEY_PATH")

      - name: Build and test the changes, in PR schemas
        if: steps.changes.outputs.count != '0'
        working-directory: dbt
        run: |
          uv run dbt build --target ci --select "state:modified+" --defer --state ../prod-state \
            2>&1 | tee ../build.log

      - name: Summary
        if: always()
        env:
          COUNT: ${{ steps.changes.outputs.count }}
        run: |
          {
            echo "### dbt slim CI: $DBT_CI_SCHEMA"
            if [ "${COUNT:-}" = "0" ]; then
              echo "No dbt changes: nothing to build."
            else
              echo "Built and tested ${COUNT:-?} node(s) in \`EARNINGSWATCH_CI.${DBT_CI_SCHEMA}_*\`."
              echo
              echo '```'
              grep -E "Done\. PASS=|ERROR|FAIL" build.log 2>/dev/null | tail -10 || echo "(no build log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SVC_CI's key
        if: always()
        run: rm -f "$DBT_SNOWFLAKE_PRIVATE_KEY_PATH"

  release:
    # On main, once every check passes: build and publish a release, then deploy it if the host is
    # awake. A stopped host starts the current release at its next start (05:45 UTC).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-test, image-tests, security]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: production  # only main may use it; the AWS deploy role trusts nothing else
    permissions:
      contents: read
      id-token: write  # lets the job ask GitHub for its signed OIDC token
    concurrency:
      group: release-production
      cancel-in-progress: false  # releases run one at a time, each to completion
    env:
      LAKE_BUCKET: ${{ vars.LAKE_BUCKET }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # artifacts are named after the last commit that changed them

      - name: AWS CLI (the runner's own, or a pinned and verified install)
        run: |
          if aws --version 2>/dev/null; then exit 0; fi
          curl -fsSL -o /tmp/awscli.zip https://awscli.amazonaws.com/awscli-exe-linux-aarch64-2.39.3.zip
          echo "f6eb845fbacb11bee87de3f5fbe8043773cbe89d0414607b44b71e216eb9226b  /tmp/awscli.zip" | sha256sum -c -
          unzip -q /tmp/awscli.zip -d /tmp && sudo /tmp/aws/install && aws --version

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR (every later step pulls or pushes, whether or not an image is built)
        run: |
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"

      - name: Image (built only if this commit changed it)
        id: image
        run: |
          image="$(scripts/build_airflow_image.sh "$ECR_REPOSITORY" | tail -1)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "commit=${image##*:}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the image (every service healthy, every DAG imported)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SMOKE_TEST_THROWAWAY: "1"  # generated keys and secrets: CI never holds a real one
        run: |
          docker pull --quiet "$IMAGE" >/dev/null
          scripts/smoke_test_prod_stack.sh "$IMAGE"

      - name: Spark code (uploaded only if this commit changed it)
        id: spark
        run: echo "commit=$(scripts/package_spark_job.sh "$LAKE_BUCKET" | tail -1)" >> "$GITHUB_OUTPUT"

      - name: dbt manifest, for slim CI on pull requests
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          COMMIT: ${{ steps.image.outputs.commit }}
        run: |
          docker run --rm --entrypoint cat "$IMAGE" /opt/airflow/dbt/target/manifest.json > manifest.json
          aws s3 cp --only-show-errors manifest.json "s3://$LAKE_BUCKET/artifacts/dbt/$COMMIT/manifest.json"

      - name: Publish the release
        env:
          COMMIT: ${{ steps.image.outputs.commit }}
          SPARK: ${{ steps.spark.outputs.commit }}
        run: scripts/publish_release.sh "$COMMIT" "$SPARK"

      - name: Deploy, if the host is running
        id: deploy
        run: scripts/deploy_release.sh 2>&1 | tee deploy.log

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SPARK: ${{ steps.spark.outputs.commit }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          {
            echo "### Release ${IMAGE##*:}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Spark code | \`s3://$LAKE_BUCKET/artifacts/spark/$SPARK\` |"
            echo "| Deploy | $DEPLOY |"
            echo
            echo '```'
            tail -5 deploy.log 2>/dev/null || echo "(no deploy)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
