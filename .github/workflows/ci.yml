name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A newer push cancels a still-running check of an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to exact commits, not movable version tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"  # the same Java as EMR's emr-spark-8.0.0 runtime

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        env:
          REQUIRE_SPARK_TESTS: "1"  # fail, never skip, if Java is missing
        run: uv run pytest -v

  dag-tests:
    # The DAG tests need Airflow, its providers and Cosmos: they run inside the real image,
    # which this job also builds, so a broken requirements.txt fails here, not on a laptop.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the Airflow image
        run: docker build -t earnings-watch-airflow:ci airflow

      - name: DAG integrity tests, inside the image
        run: scripts/test_dags.sh earnings-watch-airflow:ci
