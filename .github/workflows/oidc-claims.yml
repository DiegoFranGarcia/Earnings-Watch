name: OIDC claims

# Debugging aid: print the claims of the OIDC token a production-environment job receives, so the
# AWS trust policy can match them exactly. Prints the claims only, never the token.
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  show-claims:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Claims of this job's token
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$token" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "aud", "repository", "repository_owner", "environment", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY
