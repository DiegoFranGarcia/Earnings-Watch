# The public site's app (site/), checked on every pull request: the sixth required check, `site`.
# It builds against an invented fixture export, never real data, assembles it as the deploy does
# (site.yml: the app beside the export's files), and tests the result in a real browser served
# the way GitHub Pages serves it, under /Earnings-Watch/ (ADR 19).
name: Site CI

on:
  pull_request:

permissions: {}

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read  # check out the code
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: site/.nvmrc

      - name: Install exactly the lockfile (no install scripts run; site/.npmrc)
        run: npm ci

      - name: The two-week rule, for every package in the lockfile (ADR 14)
        run: python3 ../scripts/check_npm_lock_age.py package-lock.json

      - name: Known vulnerabilities in the site's packages
        run: npm audit --audit-level=high

      - name: Types and Svelte checks
        run: npm run check

      - name: Build against the fixture export
        run: |
          uv run --frozen python ../scripts/make_site_fixture.py --out fixture
          EW_DATA_DIR=fixture npm run build

      - name: Assemble as the deploy does (the app beside the export's files)
        run: python3 ../scripts/build_site.py --add-app build --out fixture

      - name: Browser tests, under /Earnings-Watch/ as on Pages
        run: |
          npx playwright install --with-deps chromium
          npm test
