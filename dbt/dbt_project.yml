name: earningswatch
version: "0.1.0"
profile: earningswatch
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

models:
  earningswatch:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  earningswatch:
    metric_tag_map:
      +column_types:
        metric: varchar
        tag: varchar
        priority: integer

flags:
  send_anonymous_usage_stats: false
