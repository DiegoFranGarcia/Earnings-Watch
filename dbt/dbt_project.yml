name: earningswatch
version: "0.1.0"
profile: earningswatch
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

models:
  earningswatch:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table   # built once, so tests do not re-scan 189 million RAW rows
    marts:
      +schema: marts
      +materialized: table

seeds:
  earningswatch:
    +schema: staging
    metrics:
      +column_types:
        metric: varchar
        kind: varchar
        statement: varchar
        description: varchar
    metric_tag_map:
      +column_types:
        metric: varchar
        tag: varchar
        priority: integer

vars:
  # A value counts as restated when its latest figure differs from the first-reported one by
  # more than this share of it: smaller differences are rounding (thousands vs millions).
  restatement_threshold: 0.005

flags:
  send_anonymous_usage_stats: false
