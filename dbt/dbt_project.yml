name: earningswatch
version: "0.1.0"
profile: earningswatch
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

# After every dbt invocation, record each result in AUDIT.DBT_RESULTS (macros/audit.sql).
on-run-end:
  - "{{ log_dbt_results(results) }}"

# Stored test failures (store_failures) go to AUDIT, the schema TRANSFORMER can write.
data_tests:
  earningswatch:
    +schema: audit

models:
  earningswatch:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table   # built once, so tests do not re-scan 189 million RAW rows
    marts:
      +schema: marts
      +materialized: table
    # The public site's export contract (ADR 17): only what its pages show, as tables in MARTS,
    # which REPORTER reads. publish_site writes each one to Parquet after every good build.
    exports:
      +schema: marts
      +materialized: table

seeds:
  earningswatch:
    +schema: staging
    metrics:
      +column_types:
        metric: varchar
        kind: varchar
        statement: varchar
        description: varchar
    filing_deadlines:
      +column_types:
        filer_status: varchar
        form: varchar
        deadline_days: integer
        extension_days: integer
        filer_group: varchar
    metric_tag_map:
      +column_types:
        metric: varchar
        tag: varchar
        priority: integer
    sic_codes:
      +column_types:
        sic: integer
        office: varchar
        industry_title: varchar
    sec_closed_days:
      +column_types:
        closed_date: date
        reason: varchar
        source: varchar

vars:
  # A value counts as restated when its latest figure differs from the first-reported one by
  # more than this share of it: smaller differences are rounding (thousands vs millions).
  restatement_threshold: 0.005
  # Earnings-quality screen: trailing-twelve-month accruals (net income minus operating cash
  # flow) larger than this share of average total assets.
  accrual_ratio_threshold: 0.10
  # Only companies with at least this much average total assets (USD) are screened: below it,
  # near-zero assets make accrual ratios explode (shell companies at hundreds of times assets).
  minimum_average_assets: 10000000
  # A year's net income or operating cash flow above this multiple of average total assets is
  # implausible: shown on the site with a warning, and listed by a warning test (ADR 8).
  implausible_multiple_of_assets: 2
  # Prices for mart_pipeline_costs (check your contract and region before relying on them).
  snowflake_dollars_per_credit: 2.00  # Standard edition, on demand
  emr_dollars_per_vcpu_hour: 0.052624  # EMR Serverless, us-east-1
  emr_dollars_per_gb_hour: 0.0057785
  emr_dollars_per_storage_gb_hour: 0.000111
  # The public site's export (models/exports): a company counts as still filing when its latest
  # screened quarter became knowable within this many months of the newest data (not of today,
  # so the screener changes only when the data does); quarters before the first are
  # left out of the company page; the restatements page lists this many of the largest.
  site_recent_months: 18
  site_first_quarter: "2015-01-01"
  site_largest_restatements: 500
  # The restatements page also lists the largest amendments (corrections) by the change as a
  # share of total assets, among changes of at least this many dollars.
  site_largest_amendments: 500
  site_amendment_min_change: 1000000

flags:
  send_anonymous_usage_stats: false
