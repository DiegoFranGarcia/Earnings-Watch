version: 2

models:
  - name: int_facts__canonical
    description: "Grain: one value per filing, metric, value date and duration, best tag first."
    columns:
      - name: metric
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]

unit_tests:
  - name: canonical_skips_empty_values_when_ranking_tags
    description: >
      A filing reports NetIncomeLoss (priority 1) with no value, and ProfitLoss (priority 2)
      with a real number. The empty value must not win: the metric comes from ProfitLoss.
    model: int_facts__canonical
    given:
      - input: ref('stg_sec__numbers')
        rows:
          - {accession_number: "A", cik: 1, tag: "NetIncomeLoss", taxonomy_version: "us-gaap/2026", value_date: "2026-06-30", duration_quarters: 2, unit: "USD", value: null, is_entity_total: true, has_key_conflict: false}
          - {accession_number: "A", cik: 1, tag: "ProfitLoss", taxonomy_version: "us-gaap/2026", value_date: "2026-06-30", duration_quarters: 2, unit: "USD", value: 75, is_entity_total: true, has_key_conflict: false}
      - input: ref('metric_tag_map')
        rows:
          - {metric: "net_income", tag: "NetIncomeLoss", priority: 1}
          - {metric: "net_income", tag: "ProfitLoss", priority: 2}
    expect:
      rows:
        - {accession_number: "A", metric: "net_income", tag: "ProfitLoss", value: 75}
