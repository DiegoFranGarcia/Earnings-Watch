version: 2

sources:
  - name: raw
    description: >
      Silver FSDS Parquet loaded by the snowflake_load DAG, one transaction per source
      quarter, each verified against Spark's reconciliation record before commit.
    database: "{{ env_var('DBT_SOURCE_DATABASE', target.database) }}"
    schema: RAW
    config:
      loaded_at_field: _loaded_at
      freshness:
        # The SEC publishes a quarter's data sets a few weeks after it ends.
        warn_after: {count: 100, period: day}
        error_after: {count: 130, period: day}
    tables:
      - name: fsds_sub
        identifier: FSDS_SUB
        description: One row per EDGAR submission (filing).
      - name: fsds_num
        identifier: FSDS_NUM
        description: One row per number reported in a filing.
      - name: daily_index
        identifier: DAILY_INDEX
        description: >
          Every filing EDGAR accepted, one silver file per business day, loaded a month per
          transaction. A filing appears once per company involved (Form 4: the insider and
          the issuer), so the grain is filing and CIK.
        config:
          loaded_at_field: _loaded_at
          freshness:
            # Published nightly on business days; four days allows a long weekend.
            warn_after: {count: 4, period: day}
            error_after: {count: 7, period: day}
