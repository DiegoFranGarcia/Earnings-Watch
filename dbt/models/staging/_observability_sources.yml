version: 2

sources:
  - name: snowflake_usage
    description: >
      Snowflake's own usage views, read through the USAGE_VIEWER database role (granted to
      TRANSFORMER in infra/snowflake/bootstrap.sql). Latency can be up to six hours.
    database: SNOWFLAKE
    schema: ACCOUNT_USAGE
    tables:
      - name: query_attribution_history
        identifier: QUERY_ATTRIBUTION_HISTORY
        description: >
          Credits attributed to each query, with its query tag. Excludes warehouse idle time
          (the 60 seconds before auto-suspend), so attributed cost understates the bill.

  - name: audit
    description: Tables Airflow writes in AUDIT, as LOADER (scripts/create_audit_tables.py).
    schema: AUDIT
    tables:
      - name: emr_job_runs
        identifier: EMR_JOB_RUNS
        description: What EMR billed for each Spark job, recorded by sec_fsds_quarterly.
      - name: dq_results
        identifier: DQ_RESULTS
        description: Every volume check's result, recorded by dbt_build's volume gate.
      - name: dbt_results
        identifier: DBT_RESULTS
        description: >
          Every model, seed and test result of every dbt invocation, recorded by the on-run-end
          hook in macros/audit.sql (owned by TRANSFORMER).
      - name: airflow_task_attempts
        identifier: AIRFLOW_TASK_ATTEMPTS
        description: >
          Every finished try of every Airflow task, one row per DAG, run, task, map index and
          try, copied from Airflow's own records through its REST API by record_task_history
          (daily, three days back, merged). A task a retry recovered has a failed try and a
          successful one.
