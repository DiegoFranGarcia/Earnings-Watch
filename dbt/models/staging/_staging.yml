version: 2

models:
  - name: stg_sec__submissions
    description: "Grain: one row per filing (accession number)."
    columns:
      - name: accession_number
        data_tests: [unique, not_null]
      - name: cik
        data_tests: [not_null]

  - name: stg_sec__numbers
    description: "Grain: one row per reported number (the SEC's eight-column key, see has_key_conflict)."
    columns:
      - name: accession_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sec__submissions')
                field: accession_number
              config:
                # Source data, not our transformation: the SEC's 2013q1 data set holds 1,953
                # numbers from 4 filings it never lists. They cannot reach the mart (filings
                # are inner-joined), so this warns and stays visible instead of failing.
                severity: warn
                store_failures: true
      - name: duration_quarters
        description: >
          Quarters the number covers: 0 is a point in time, 1 a quarter, 4 a year. Longer spans
          are legitimate (cumulative totals, e.g. restructuring costs to date).
        data_tests: [not_null]

  - name: stg_sec__daily_index
    description: >
      Grain: one row per filing and company (accession number, CIK) in EDGAR's daily index,
      for every form type, including late-filing notices (NT 10-K, NT 10-Q).
    columns:
      - name: accession_number
        data_tests: [not_null]
      - name: cik
        data_tests: [not_null]
      - name: form
        data_tests: [not_null]
      - name: filed_date
        data_tests: [not_null]
