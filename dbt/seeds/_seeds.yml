version: 2

seeds:
  - name: metrics
    description: >
      The canonical metrics. kind is "flow" (measured over a span, such as revenue for a
      quarter; year-to-date in 10-Qs) or "instant" (measured at a point in time, such as
      total assets at quarter end).
    columns:
      - name: metric
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [flow, instant]
      - name: statement
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [income_statement, cash_flow, balance_sheet]

  - name: metric_tag_map
    description: >
      Which XBRL tags count as each canonical metric, best first. Companies tag the same
      concept differently, and tags change with accounting standards (revenue's did with
      ASC 606 in 2018); a lower priority number wins when a filing reports several.
    columns:
      - name: metric
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('metrics')
                field: metric
      - name: tag
        data_tests: [unique, not_null]

  - name: filing_deadlines
    description: >
      SEC deadlines for 10-K and 10-Q filings, in days after the period end, by filer status
      (1-LAF large accelerated, 2-ACC accelerated, 3-SRA smaller reporting accelerated,
      4-NON non-accelerated, 5-SML smaller reporting), and the extra days a late-filing
      notice (Form 12b-25: NT 10-K or NT 10-Q) grants.
    columns:
      - name: filer_status
        data_tests: [not_null]
      - name: form
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["10-K", "10-Q"]
