# Production Compose file for the Airflow host (Stage 7). Derived from the official Airflow 3.3.1
# docker-compose.yaml, and changed only where production needs it:
# - LocalExecutor: one host, so no Redis, Celery worker or Flower;
# - the DAGs and the dbt project are baked into the image, not mounted;
# - real secrets for the database, the Fernet key, the JWT secret and the admin user;
# - the API server listens on 127.0.0.1 only: reach it through an SSM port-forwarding session;
# - task logs also go to S3, so they outlive the instance.
#
# Every variable comes from one env file, which the host writes at boot into memory (/run):
#   docker compose --env-file /run/earningswatch/airflow.env -f compose.yaml up -d

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE:?set AIRFLOW_IMAGE to the image to run}
  env_file:
    - ${ENV_FILE_PATH:-/run/earningswatch/airflow.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Task logs to S3 as well, through a connection with no keys: boto3 uses the instance role.
    AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://${LAKE_BUCKET:?}/airflow/logs
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: aws_default
    AIRFLOW_CONN_AWS_DEFAULT: "aws://"
    AWS_DEFAULT_REGION: us-east-1
    DBT_PROJECT_DIR: /opt/airflow/dbt
    PYTHONPATH: /opt/airflow/dags
  volumes:
    - ${EARNINGSWATCH_HOME:-/opt/earningswatch}/logs:/opt/airflow/logs
    - ${KEYS_DIR:-/run/earningswatch/keys}:/opt/airflow/keys:ro
  user: "50000:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # slow first boots (CPU credits) are not failures
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # slow first boots (CPU credits) are not failures
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # slow first boots (CPU credits) are not failures
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # slow first boots (CPU credits) are not failures
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Migrates the metadata database and creates the admin user, then exits. The official image's
  # entrypoint does both when these two variables are set.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "/entrypoint airflow version"]
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?}

volumes:
  postgres-db-volume:
