# Laptop-only settings. Docker Compose merges this file over docker-compose.yaml automatically.
# On EC2 (Stage 7) an IAM role and Secrets Manager provide credentials; this file is not used.

x-local-aws: &local-aws
  environment:
    AWS_PROFILE: earnings-watch
    AWS_DEFAULT_REGION: us-east-1
    # Explicit paths, so they work whatever the container's home directory is.
    AWS_CONFIG_FILE: /home/airflow/.aws/config
    AWS_LOGIN_CACHE_DIRECTORY: /home/airflow/.aws/login/cache
  volumes:
    # Your `aws login` session. Read-write, because boto3 saves refreshed tokens here.
    - ${HOME}/.aws:/home/airflow/.aws

services:
  # Tasks run inside the scheduler with LocalExecutor.
  airflow-scheduler:
    <<: *local-aws
    volumes:
      - ${HOME}/.aws:/home/airflow/.aws
      # Snowflake private keys, one file each, read-only: SVC_AIRFLOW loads, SVC_DBT transforms.
      - ${HOME}/.snowflake/keys/svc_airflow_rsa_key.p8:/opt/airflow/keys/svc_airflow_rsa_key.p8:ro
      - ${HOME}/.snowflake/keys/svc_dbt_rsa_key.p8:/opt/airflow/keys/svc_dbt_rsa_key.p8:ro
      # The dbt project, read-only: Cosmos runs each model in a temporary copy of it.
      - ../dbt:/opt/airflow/dbt:ro
  # Parses DAG files; the dbt_build DAG reads the dbt manifest while parsing.
  airflow-dag-processor:
    volumes:
      - ../dbt:/opt/airflow/dbt:ro
  # Deferrable tasks poll from here; it never talks to Snowflake or runs dbt.
  airflow-triggerer: *local-aws
